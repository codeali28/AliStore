<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aliStoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#6610f2" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Favicon squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#aliStoreGrad)" />

  <!-- Inner highlight -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Shopping Bag Icon -->
  <g filter="url(#iconShadow)">
    <!-- Bag Handle -->
    <path d="M24 24 C24 16, 40 16, 40 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Bag Body -->
    <path d="M18 23 H46 L43.5 48 C43.3 50.2 41.5 52 39.3 52 H24.7 C22.5 52 20.7 50.2 20.5 48 Z" fill="#ffffff" />

    <!-- Bag Neck Fold (Accent) -->
    <path d="M26 23 L32 30 L38 23" fill="none" stroke="#0d6efd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brand Star / Sparkle in Center -->
    <polygon points="32,33 33.8,37.2 38,38 34.5,41 35.5,45.5 32,43 28.5,45.5 29.5,41 26,38 30.2,37.2" fill="#ffc107" />
  </g>
</svg>